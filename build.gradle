buildscript {
    ext {
        kotlin_version = "1.9.0" // Ensure this matches your desired Kotlin version
        ksp_version = "1.9.0-1.0.13" // KSP version compatible with Kotlin 1.9.0
        gradle_version = "8.0.2" // Use Gradle 8.0.2 or later
    }
    ext {
        compose_version = '1.3.0'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.android.tools.build:gradle:$gradle_version" // Use Gradle 8.0.2
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.48'
        classpath 'com.google.gms:google-services:4.3.14'
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:$ksp_version" // Add KSP plugin
    }
}

plugins {
    id 'com.android.application' version "$gradle_version" apply false
    id 'com.android.library' version "$gradle_version" apply false
    id 'org.jetbrains.kotlin.android' version "$kotlin_version" apply false // Use Kotlin 1.9.0
    id 'com.google.dagger.hilt.android' version '2.44' apply false
    id 'com.google.gms.google-services' version '4.4.2' apply false
    id 'com.google.devtools.ksp' version "$ksp_version" apply false // Add KSP plugin
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
